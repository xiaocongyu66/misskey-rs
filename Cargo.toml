[workspace]
resolver = "2"
members = [
    "crates/mk-types",
    "crates/mk-jsonschema",
    "crates/mfm-rs",
    "crates/mk-db",
    "crates/mk-core",
    "crates/mk-queue",
    "crates/mk-ap",
    "crates/misskey-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
# push-crypto: RFC 8291 aes128gcm payload seal (pure-Rust aes+ghash transitives)
aes-gcm = "0.10"
axum = { version = "0.8", features = ["ws"] }
# drive lane: reqwest = the DriveService.uploadFromUrl downloader; futures-util
# = the /streaming websocket hub (split + forward task over ws::WebSocket).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# smtp-tls: raw TLS-wrapped TCP for SMTP STARTTLS (SMTP is not HTTP, so the
# reqwest client is unusable). Same ring provider + webpki roots the reqwest
# chain already pins in Cargo.lock — default features stay off so aws-lc-rs
# is never pulled in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
base64 = "0.22"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
bcrypt = "0.15"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
regex = "1"

mk-types = { path = "crates/mk-types" }
mk-jsonschema = { path = "crates/mk-jsonschema" }
mfm-rs = { path = "crates/mfm-rs" }
mk-db = { path = "crates/mk-db" }
mk-core = { path = "crates/mk-core" }
mk-queue = { path = "crates/mk-queue" }
mk-ap = { path = "crates/mk-ap" }
