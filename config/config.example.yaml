# packages/backend/src/config.ts upstream.

url: http://localhost:3000
port: 3000

db:
  host: 127.0.0.1
  port: 5432
  user: postgres
  pass: postgres
  db: misskey

redis:
  host: 127.0.0.1
  port: 6379

