name: e2e-oauth-rustregs

on:
  workflow_dispatch:

jobs:
  oauth-rust-regs:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: misskey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build test targets
        run: cargo build --workspace --all-targets
      - name: Run the oauth rust tests isolated
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/misskey_test
        run: |
          cargo test --workspace -- --test-threads=1 --nocapture \
            api::tests::oauth_ \
            || echo "::warning::oauth regs reproduction run done (see report)"
      - name: oauth rust regs census
        if: always()
        run: |
          cargo test --workspace -- --test-threads=1 \
            api::tests::oauth_ 2>&1 | tail -20
