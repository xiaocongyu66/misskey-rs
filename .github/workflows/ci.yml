name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    services:
      # No redis: nothing in the workspace links or talks to it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: misskey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size=1g
          --tmpfs /var/lib/postgresql/data:size=2g
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        # Tests clone a pre-migrated template database instead of replaying
        # the 40k-line 0001 DDL per test, so one serial process is fast.
        timeout-minutes: 30
        # cargo test --workspace runs one process per test target, all in
        # parallel; their migrations contend on sqlx's global advisory lock
        # (lock_timeout does not reliably interrupt that wait). Run the
        # binaries one at a time instead.
        run: |
          cargo test -p misskey-rs --bins -- --test-threads=1
          cargo test -p mk-db --lib -- --test-threads=1
          cargo test -p mk-core --lib -- --test-threads=1
          cargo test -p mk-ap --lib -- --test-threads=1
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/misskey_test
      - name: Dump Postgres state (diagnostics)
        if: failure()
        run: |
          CID=$(docker ps -aq -f ancestor=postgres:16 | head -1)
          echo "=== container: $CID"
          docker ps -a --filter id=$CID
          echo "=== pg_stat_activity"
          docker exec $CID psql -U postgres -c "SELECT pid, state, wait_event_type, wait_event, left(query,160) FROM pg_stat_activity WHERE backend_type = 'client backend'" || true
          echo "=== blocked locks"
          docker exec $CID psql -U postgres -c "SELECT pid, locktype, relation::regclass, mode, granted FROM pg_locks WHERE NOT granted" || true
          echo "=== lock counts per backend"
          docker exec $CID psql -U postgres -c "SELECT pid, count(*) FROM pg_locks GROUP BY pid ORDER BY 2 DESC LIMIT 5" || true
          echo "=== postgres log tail"
          docker logs --tail 30 $CID || true
          echo "=== memory"
          free -m || true
          echo "=== OOM evidence"
          dmesg 2>/dev/null | grep -iE "killed process|out of memory" | tail -5 || true
