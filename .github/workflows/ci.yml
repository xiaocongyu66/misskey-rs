name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: misskey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clean leftover test databases
        # Each test creates its own mk* database and never drops it; leftovers
        # from earlier runs wedge the migrations.
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -tAc \
            "SELECT datname FROM pg_database WHERE datname LIKE 'mk%'" | \
          while read -r db; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -tAc \
              "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$db'" >/dev/null
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -tAc \
              "DROP DATABASE IF EXISTS \"$db\" WITH (FORCE)" >/dev/null || true
          done
      - name: Test
        # serial suite: concurrent fresh-db pools wedge the runner. A single
        # serial process handled 152 tests fine once the leftover mk* databases
        # were cleaned, so the full suite runs in one step.
        run: cargo test --workspace -- --test-threads=1
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/misskey_test
