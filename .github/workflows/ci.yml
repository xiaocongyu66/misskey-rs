name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-a:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: misskey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace -- --test-threads=1 --skip hashtags_users_tag_normalization_and_sort --skip i_authorized_apps_lists_only_callers_apps --skip i_endpoint --skip i_endpoint --skip i_export_antennas_and_webhooks_crud --skip i_favorites_lists_only_callers_rows --skip i_flash_likes_lists_only_callers_likes --skip i_flashs_lists_only_callers_flashs --skip i_gallery_likes_lists_only_callers_rows --skip i_pages_likes_lists_only_callers_rows --skip i_pin_unpin_roundtrip --skip i_registry_and_signin_history_roundtrip --skip i_registry_keys_with_type_and_scopes_with_domain --skip i_update_avatar_banner_drive_swap --skip i_update_birthday_absent_vs_null --skip i_update_email_and_revoke_token --skip i_update_persists_is_bot_and_is_cat --skip i_update_requires_native_token --skip i_update_roundtrip --skip invite_promo_roundtrip --skip meili_index_document_shape_and_should_index_gate --skip meili_notes_search_uses_engine_when_present --skip move_final_counts_adjust_legs --skip move_final_muting_copy_dedup_prepares_and_filters --skip noise_gate_muter_silence_and_thread_mute --skip note_notify_following_list_notification_filter --skip note_notify_push_leg_note_reason --skip notes_clips_lists_public_clips_containing_note --skip notes_create_and_show --skip notes_create_channel_legs_and_tl_folds --skip notes_create_mentions_and_translate_ladder --skip notes_create_poll_ladder --skip notes_create_reply_ladder_and_delete_truth --skip notes_create_requires_auth --skip notes_create_word_ladders --skip notes_more_batch_flow --skip notes_search_sql_fallback_gate_and_hits --skip notes_show_partial_bulk_returns_minimal_packs --skip notifications_insert_if_not_muted_central_gate --skip notifications_mention_reaction_and_mark_as_read --skip oauth_bearer_scope_gate --skip oauth_route_skeleton --skip page_push_validates_page_and_returns_204 --skip pages_arena_crud_like_list --skip password_reset_round_trip_and_wrong_code --skip pinned_users_lists_meta_accts --skip push_fanout_mention_reply_renote_reaction_invokes_send --skip push_send_dead_endpoint_swallowed_note_still_200s --skip push_send_list_by_user_row_shape_and_type_filter --skip queue2_export_muting_roundtrip --skip queue2_export_user_lists_roundtrip --skip queue_min_delete_account_handler_soft_purges_notes_and_marks_user --skip queue_min_ended_poll_handler_creates_poll_ended_notifications --skip queue_min_enqueue_rows_visible_and_delayed_not_due --skip renote_mute_list_roundtrip --skip renote_mute_stream_timeline_fanout --skip retention_reads_recent_aggregations --skip roles_list_and_show_public_explorable --skip roles_notes_lists_role_holder_notes --skip roles_users_lists_role_assignments --skip signin_flow --skip signup_carries_policies_and_compat_keys --skip signup_duplicated_username --skip signup_ignores_bot_and_cat_params --skip signup_roundtrip --skip social_block_flow --skip social_follow_flow --skip social_follow_request_lock_accept_cancel --skip social_mute_flow_and_search_exclusion --skip social_renote_flow --skip sw_register_row_already_subscribed_and_unregister_void --skip thread_mute_root_note_thread_key_decodes_null --skip timelines_matrix_home_local_hybrid --skip timelines_tl_v3c_per_stream_legs --skip tl_tail_remote_host_and_channel_renote_shapes --skip two_factor_register_done_unregister_flow --skip twofa_final_register_on_enabled_profile_gate --skip user_list_timeline_filters_pager_channel --skip user_list_timeline_membership_visibility_replies --skip user_list_timeline_ul_tl2_specified_pager_window_withfiles --skip username_available_detects_existing_and_reserved --skip users_achievements_returns_profile_array --skip users_featured_notes_returns_public_notes --skip users_flashs_lists_public_flashes_of_user --skip users_gallery_posts_lists_posts_of_user --skip users_lists_list_owner_public_and_guest_gates --skip users_lists_more_create_push_show_membership_update_pull_delete --skip users_notes_user_tl_channel_plane_legs --skip users_notes_user_tl_mute_chain_reply_gate_since_id --skip users_pages_lists_public_pages_of_user --skip users_recommendation_excludes_self_and_followees --skip users_relation_flags_on_following_row --skip users_search_family --skip users_show_variant --skip users_update_memo_roundtrip --skip well_known_hostmeta_and_oauth --skip well_known_nodeinfo_links --skip well_known_webfinger_jrd --skip v2_admin_emoji_list_filters_pages_and_admin_gate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/misskey_test
