name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    services:
      # No redis: nothing in the workspace links or talks to it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: misskey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        # Tests clone a pre-migrated template database instead of replaying
        # the 40k-line 0001 DDL per test, so one serial process is fast.
        run: cargo test --workspace -- --test-threads=1
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/misskey_test
