[package]
name = "misskey-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "misskey-rs"
path = "src/main.rs"

[dependencies]
mk-types = { workspace = true }
mk-db = { workspace = true }
mk-core = { workspace = true }
# arena-exports: the PG-brokered durable queue (mk_queue_jobs) the
# `exportClips` job rides — spawn_export_worker + QueueHandle::enqueue.
mk-queue = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# arena-oauth: PKCE S256 verify (sha256 digest → base64url) + client_id /
# redirect_uri URL normalization (both already pinned in Cargo.lock via the
# rsa / reqwest transitives)
sha2 = "0.10"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
