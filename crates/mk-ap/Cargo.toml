[package]
name = "mk-ap"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# fed-min: rsa = the SAME workspace crypto dep signup.rs keys users with —
# RSA-SHA256 (PKCS#1 v1.5) verify + sha2 digest for the draft-cavage Digest
# check; base64 0.22 rides the lock already (reqwest transitives).
rsa = { workspace = true }
base64 = "0.22"
# fed-2: the InboxProcessorService worker lane persists through mk-db's
# following/note_reaction/note helpers and ids via mk_types::id (gen_aid_now).
# ap-keys: the fetch lane's minimal HTTP client rides tokio's TcpStream,
# the remote-key-miss log rides tracing (workspace shapes).
tokio = { workspace = true }
tracing = { workspace = true }
mk-db = { workspace = true }
mk-types = { workspace = true }
# tls-http: https:// actor keyIds ride mk_core::services::tls_http (reqwest
# + rustls); mk-core has no dependency on mk-ap, so no cycle.
mk-core = { workspace = true }
# ap-keys: the in-process remote-key TTL cache rides once_cell (already in
# the lockfile as a reqwest transitive).
once_cell = "1"
sqlx = { workspace = true }

[dev-dependencies]
# fed-min: the createSignedPost round-trip test signs with a fresh key
# (generate_rsa_keypair_pem's rand::thread_rng pattern).
rand = { workspace = true }
