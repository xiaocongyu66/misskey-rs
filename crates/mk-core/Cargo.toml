[package]
name = "mk-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# tls-http: the shared rustls client for https:// federation reads
# (tls_http::get_json/get_text). Same workspace reqwest the drive lane uses.
reqwest = { workspace = true }
# smtp-tls: STARTTLS for SmtpSender — a raw TLS-wrapped TCP stream, not HTTP.
# rustls/tokio-rustls/webpki-roots/base64 ride the lock (reqwest transitives).
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
aes-gcm = { workspace = true }
mk-types = { workspace = true }
mk-db = { workspace = true }
bcrypt = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
